<div class="container-fluid vh-100 d-flex align-items-center justify-content-center bg-light">
  <div class="row w-100">
    <div class="col-md-6 col-lg-4 mx-auto">
      <div class="card shadow">
        <div class="card-body p-5">
          <div class="text-center mb-4">
            <h2 class="card-title text-primary">Change Password</h2>
            <p class="text-muted">Update your account password</p>
          </div>

          <form [formGroup]="changePasswordForm" (ngSubmit)="onSubmit()">
            <!-- Username Field -->
            <div class="mb-3">
              <label for="username" class="form-label">Username</label>
              <div class="input-group">
                <input type="text" class="form-control" id="username" formControlName="username"
                  [class.is-invalid]="getFieldError('username')" placeholder="Enter your username">
                <button type="button" class="btn btn-outline-secondary" (click)="checkUser()" 
                  [disabled]="!changePasswordForm.get('username')?.value || loading">
                  {{ loading ? 'Checking...' : 'Check' }}
                </button>
              </div>
              <div class="invalid-feedback" *ngIf="getFieldError('username')">
                {{ getFieldError('username') }}
              </div>
            </div>

            <!-- Password Fields (shown only after user is found) -->
            <div *ngIf="userFound">
              <div class="mb-3">
                <label for="currentPassword" class="form-label">Current Password</label>
                <input type="password" class="form-control" id="currentPassword" formControlName="currentPassword"
                  [class.is-invalid]="getFieldError('currentPassword')" placeholder="Enter current password">
                <div class="invalid-feedback" *ngIf="getFieldError('currentPassword')">
                  {{ getFieldError('currentPassword') }}
                </div>
              </div>

              <div class="mb-3">
                <label for="newPassword" class="form-label">New Password</label>
                <input type="password" class="form-control" id="newPassword" formControlName="newPassword"
                  [class.is-invalid]="getFieldError('newPassword')" placeholder="Enter new password">
                <div class="invalid-feedback" *ngIf="getFieldError('newPassword')">
                  {{ getFieldError('newPassword') }}
                </div>
              </div>

              <div class="mb-3">
                <label for="confirmPassword" class="form-label">Confirm New Password</label>
                <input type="password" class="form-control" id="confirmPassword" formControlName="confirmPassword"
                  [class.is-invalid]="getFieldError('confirmPassword')" placeholder="Confirm new password">
                <div class="invalid-feedback" *ngIf="getFieldError('confirmPassword')">
                  {{ getFieldError('confirmPassword') }}
                </div>
              </div>
            </div>

            <!-- Messages -->
            <div class="alert alert-danger" *ngIf="errorMessage">
              {{ errorMessage }}
            </div>

            <div class="alert alert-success" *ngIf="successMessage">
              {{ successMessage }}
            </div>

            <!-- Submit Button (shown only after user is found) -->
            <div class="d-grid gap-2 mb-3" *ngIf="userFound">
              <button type="submit" class="btn btn-primary" [disabled]="!changePasswordForm.valid || loading">
                <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>
                {{ loading ? 'Changing Password...' : 'Change Password' }}
              </button>
            </div>

            <div class="text-center">
              <p class="mb-0">
                <a routerLink="/auth/login" class="text-secondary">Back to Login</a>
              </p>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
